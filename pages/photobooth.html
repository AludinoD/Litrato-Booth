<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Litrato - Photobooth</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../styles/photobooth.css" />
  </head>
  <body>
    <!-- Top Navigation Bar -->
    <header class="navbar">
      <div class="nav-container">
        <a href="../index.html" class="nav-logo">Litrato</a>
      </div>
    </header>

    <main class="photobooth-wrapper">
      <!-- Progress Tracker / Timeline -->
      <nav class="timeline-container" aria-label="Photobooth Progress">
        <ol class="timeline-list">
          <li class="timeline-step active" id="step-node-1" aria-current="step">
            <div class="step-circle">1</div>
            <span class="step-label">Select Layout</span>
          </li>
          <li class="timeline-step" id="step-node-2">
            <div class="step-circle">2</div>
            <span class="step-label">Snap Pics</span>
          </li>
          <li class="timeline-step" id="step-node-3">
            <div class="step-circle">3</div>
            <span class="step-label">Design &amp; Export</span>
          </li>
        </ol>
      </nav>

      <!-- Stage 1 Container: Select Your Layout -->
      <section
        class="stage-section active"
        id="stage-1"
        aria-labelledby="stage-1-title"
      >
        <h1 id="stage-1-title" class="stage-heading">Select Your Layout</h1>

        <!-- Orientation Switcher -->
        <div
          class="orientation-toggle"
          role="group"
          aria-label="Strip Orientation"
        >
          <button
            type="button"
            class="btn-toggle active"
            data-orientation="vertical"
          >
            Vertical
          </button>
          <button
            type="button"
            class="btn-toggle"
            data-orientation="horizontal"
          >
            Horizontal
          </button>
        </div>

        <!-- Layout Cards Grid -->
        <div class="layout-cards-grid" id="layout-options">
          <!-- 2 Photos Card -->
          <button
            type="button"
            class="layout-card"
            data-photos="2"
            aria-pressed="false"
          >
            <div class="layout-preview-frame vertical" id="preview-2">
              <div class="placeholder-box"></div>
              <div class="placeholder-box"></div>
            </div>
            <div class="layout-card-info">
              <h2 class="layout-title">2 Photos</h2>
              <span class="layout-tag">Duo Strip</span>
            </div>
          </button>

          <!-- 3 Photos Card -->
          <button
            type="button"
            class="layout-card"
            data-photos="3"
            aria-pressed="false"
          >
            <div class="layout-preview-frame vertical" id="preview-3">
              <div class="placeholder-box"></div>
              <div class="placeholder-box"></div>
              <div class="placeholder-box"></div>
            </div>
            <div class="layout-card-info">
              <h2 class="layout-title">3 Photos</h2>
              <span class="layout-tag">Classic Strip</span>
            </div>
          </button>

          <!-- 4 Photos Card -->
          <button
            type="button"
            class="layout-card"
            data-photos="4"
            aria-pressed="false"
          >
            <div class="layout-preview-frame vertical" id="preview-4">
              <div class="placeholder-box"></div>
              <div class="placeholder-box"></div>
              <div class="placeholder-box"></div>
              <div class="placeholder-box"></div>
            </div>
            <div class="layout-card-info">
              <h2 class="layout-title">4 Photos</h2>
              <span class="layout-tag">Standard Strip</span>
            </div>
          </button>
        </div>

        <div class="action-footer">
          <button
            type="button"
            id="btn-next-to-stage-2"
            class="btn-primary"
            disabled
          >
            Next Step
          </button>
        </div>
      </section>

      <!-- Stage 2 Container: Snap Pics -->
      <section
        class="stage-section"
        id="stage-2"
        aria-labelledby="stage-2-title"
        hidden
      >
        <div class="stage-top-bar">
          <button type="button" id="btn-back-to-stage-1" class="btn-text-back">
            &#8592; Back to Layouts
          </button>
        </div>

        <div class="stage-header-wrap">
          <h1 id="stage-2-title" class="stage-heading">Snap Pics</h1>
          <p class="stage-subheading">Ensure to allow camera Access</p>
        </div>

        <div class="capture-layout">
          <div class="camera-card">
            <video id="webcam-feed" autoplay playsinline muted></video>
            <div class="camera-flash" id="camera-flash"></div>

            <div
              class="countdown-overlay"
              id="countdown-overlay"
              aria-live="polite"
            >
              <span class="countdown-number" id="countdown-text">5</span>
            </div>

            <div class="camera-status" id="camera-status" hidden>
              <p>Camera access required to snap live pictures.</p>
            </div>
          </div>

          <div class="capture-controls">
            <button type="button" id="btn-take-picture" class="btn-primary">
              Take Picture
            </button>

            <label
              for="file-upload-input"
              class="btn-primary btn-secondary-style"
            >
              Upload Photo
            </label>
            <input type="file" id="file-upload-input" accept="image/*" hidden />

            <button
              type="button"
              id="btn-retake-all"
              class="btn-primary btn-secondary-style"
              disabled
            >
              Retake All
            </button>

            <button
              type="button"
              id="btn-next-to-stage-3"
              class="btn-primary btn-proceed"
              style="display: none"
            >
              Next Step
            </button>
          </div>
        </div>

        <!-- Themed Taken Pictures Section -->
        <div class="taken-pictures-section">
          <h2 class="taken-title">Taken Pictures</h2>
          <div class="thumbnails-grid" id="thumbnails-tray"></div>
        </div>

        <canvas id="photo-canvas" hidden></canvas>
        <input type="file" id="slot-replace-input" accept="image/*" hidden />
      </section>
    </main>

    <script src="../js/photobooth.js"></script>
  </body>
</html>
